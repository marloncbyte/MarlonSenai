<!DOCTYPE html>
<html lang="PT-BR">

<head>

    <meta charset="UTF-8">

    <title>ZANETTINI BAROSSI</title>

    <link href="../css/estilo.produto.css" rel="stylesheet">

</head>

<body>

    <main>

        <div class="conteudo-popup">

            <!-- BOTÃO FECHAR -->
            <span class="fechar" onclick="fecharJanela()">✖</span>

            <!-- TÍTULO -->
            <h2 id="titulo"></h2>

            <!-- SLIDER -->
            <div class="slider">

                <button id="prevBtn">⬅</button>

                <img id="slider-img" class="img-popup">

                <button id="nextBtn">➡</button>

            </div>

            <!-- DESCRIÇÃO -->
            <p id="descricao"></p>

            <!-- PREÇO -->
            <p id="preco" class="preco"></p>

        </div>

    </main>

    <script>

        // CAPTURA PARÂMETROS
        function getParametro(nomeParametro){

            let parametros = new URLSearchParams(window.location.search);

            return parametros.get(nomeParametro);

        }

        // TÍTULO
        document.getElementById("titulo").innerText =
        getParametro("nomeProduto");

        // DESCRIÇÃO
        document.getElementById("descricao").innerText =
        getParametro("descProduto");

        // PREÇO
        document.getElementById("preco").innerText =
        getParametro("precoProduto");

        // FECHAR
        function fecharJanela(){

            window.close();

        }

        // =========================
        // SLIDER
        // =========================

        const imagens =
        getParametro("imgProduto")
        ? getParametro("imgProduto").split(',')
        : [];

        let index = 0;

        const sliderImg =
        document.getElementById("slider-img");

        // MOSTRA IMAGEM
        function mostrarImagem(){

            if(imagens.length > 0){

                sliderImg.src = imagens[index];

            }

        }

        // BOTÃO ANTERIOR
        document.getElementById("prevBtn").onclick =
        function(){

            index =
            (index - 1 + imagens.length)
            % imagens.length;

            mostrarImagem();

        }

        // BOTÃO PRÓXIMO
        document.getElementById("nextBtn").onclick =
        function(){

            index =
            (index + 1)
            % imagens.length;

            mostrarImagem();

        }

        // PRIMEIRA IMAGEM
        mostrarImagem();

    </script>

</body>

</html>
